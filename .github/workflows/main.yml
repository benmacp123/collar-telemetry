name: Python Applications test with GitHub Actions

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    # uv installs the Python in .python-version (3.14, as in Lambda).
    - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
      with:
        version: "0.12.3"
    - name: Check uv.lock matches pyproject.toml
      run: uv lock --check
    - name: Install Dependencies
      run: |
        make install
        echo "$PWD/venv/bin" >> "$GITHUB_PATH"
    - name: Lint with Pylint
      run: |
        make lint
    - name: Test with Pytest
      run: |
        make test
    - name: Check formatting
      run: |
        make format-check

  # The same checks as `make tf-check`, with the CLI installed by the
  # action rather than run in Docker. Validates without AWS credentials:
  # no backend, no provider calls.
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
    - uses: actions/checkout@v4
    - uses: hashicorp/setup-terraform@v4
      with:
        terraform_version: "1.16.6"
        terraform_wrapper: false
    - name: Check formatting
      run: terraform fmt -check -recursive -diff
    - name: Validate
      run: |
        terraform init -backend=false -input=false
        terraform validate

  # Builds the deploy zip in the pinned Python 3.14 image and imports both
  # handlers from it, so a missing wheel or file fails here, not on deploy.
  lambda-zip:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    # Only to export the lambda group from uv.lock; the build runs in Docker.
    - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
      with:
        version: "0.12.3"
    - name: Build and smoke-test the zip
      run: make lambda-zip
